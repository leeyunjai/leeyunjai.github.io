baseURL = "https://leeyunjai.github.io/"
title = "DigitalBrain"
theme = "PaperMod"

defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  defaultTheme = "auto"
  disableThemeToggle = false
  disableLangToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hideSummary = false
  disableSpecial1stPost = true
  disableScrollToTop = false

  # Google AdSense publisher ID (예: "ca-pub-XXXXXXXXXXXXXXXX")
  # 승인 전에는 빈 값으로 두면 스크립트가 삽입되지 않습니다.
  adsense = ""

  # Google Analytics 4 measurement ID (예: "G-XXXXXXXXXX")
  googleAnalytics = ""

  [params.cover]
    hiddenInList = true       # 목록은 글자 위주로. 커버는 본문 상단과 공유 미리보기(OG)에만.
    hiddenInSingle = false
    responsiveImages = false
    linkFullImages = false

  [params.assets]
    disableHLJS = false
    disableFingerprinting = true
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

  [params.label]
    text = "DigitalBrain"
    # 자체 제작 마크(라이선스 문제 없음). 나머지 아이콘은 Lucide(ISC) 기하를 따릅니다.
    iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.3" fill="#2f6fed"/><path fill="#fff" fill-rule="evenodd" d="M6.6 5.6H11.4a6.4 6.4 0 0 1 0 12.8H6.6Z M9.6 8.6H11.4a3.4 3.4 0 0 1 0 6.8H9.6Z"/></svg>'
    iconHeight = 22

  # 링크 공유 시 기본 미리보기 이미지 (글에 cover.image가 없을 때)
  images = ["og-default.png"]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[languages]
  [languages.ko]
    label = "한국어"
    locale = "ko-KR"
    weight = 1
    title = "DigitalBrain"
    [languages.ko.params]
      description = "최신 기기와 소프트웨어를 스펙·가격·출처와 함께 정리하는 블로그"
      [languages.ko.params.homeInfoParams]
        Title = "새로 나온 것만, 출처 있는 것만."
        Content = "노트북부터 로봇까지, 저장소부터 모델까지. 스펙도 가격도 출처와 함께."
    [[languages.ko.params.socialIcons]]
      name = "github"
      title = "GitHub"
      url = "https://github.com/leeyunjai"
    [[languages.ko.params.socialIcons]]
      name = "rss"
      title = "RSS"
      url = "/index.xml"
    [languages.ko.params.footer]
      text = "[소개](/about/) · [개인정보처리방침](/privacy/) · [문의](mailto:leeyunjai1982@gmail.com)"
    [languages.ko.menu]
      [[languages.ko.menu.main]]
        identifier = "posts"
        name = "글목록"
        url = "/posts/"
        weight = 10
      [[languages.ko.menu.main]]
        identifier = "archives"
        name = "아카이브"
        url = "/archives/"
        weight = 20
      [[languages.ko.menu.main]]
        identifier = "tags"
        name = "태그"
        url = "/tags/"
        weight = 30
      [[languages.ko.menu.main]]
        identifier = "search"
        name = "검색"
        url = "/search/"
        weight = 40
      [[languages.ko.menu.main]]
        identifier = "about"
        name = "소개"
        url = "/about/"
        weight = 50

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    title = "DigitalBrain"
    [languages.en.params]
      description = "New hardware and software, with specs, prices, and a source for every claim"
      [languages.en.params.homeInfoParams]
        Title = "Just launched, fully sourced."
        Content = "From laptops to robots, from repositories to models. Specs and prices, always with a source."
    [[languages.en.params.socialIcons]]
      name = "github"
      title = "GitHub"
      url = "https://github.com/leeyunjai"
    [[languages.en.params.socialIcons]]
      name = "rss"
      title = "RSS"
      url = "/en/index.xml"
    [languages.en.params.footer]
      text = "[About](/en/about/) · [Privacy](/en/privacy/) · [Contact](mailto:leeyunjai1982@gmail.com)"
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/en/posts/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "archives"
        name = "Archives"
        url = "/en/archives/"
        weight = 20
      [[languages.en.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/en/tags/"
        weight = 30
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/en/search/"
        weight = 40
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/en/about/"
        weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
